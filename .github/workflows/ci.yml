name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: pip install -r requirements.txt
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Regenerate and verify all example programs (must match the committed files)
        run: python -m cncgen build --check
      - name: Fault injection (every fault must be caught)
        run: python -m cncgen inject --out fi.md --png ""
